services:
  product-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: product-api
    ports:
      - "8080:8080"
    environment:
      # PORT is read by application.yml via ${PORT:-8080}
      - PORT=8080
      - SERVER_PORT=8080
      - DUMMYJSON_BASE_URL=https://dummyjson.com
      - DUMMYJSON_CONNECTION_TIMEOUT=5000
      - DUMMYJSON_READ_TIMEOUT=10000
      - JAVA_OPTS=-XX:MaxRAMPercentage=75.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
